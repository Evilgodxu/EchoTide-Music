name: Build Check

# 与 AGENTS.md 的本地校验口径对齐：debug 构建、单元测试与 lint 是每次改动的最低门槛。
# release 需要签名凭据与 R8 全量优化，留在发布前于本机执行。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 托管镜像不保证带有本项目锁定的 SDK/NDK/CMake 版本，显式安装避免随镜像漂移
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble, test, lint
        # gradlew 在仓库里没有可执行位，显式交给 bash 解释，避免检出后 permission denied
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
