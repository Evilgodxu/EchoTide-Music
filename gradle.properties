# ============================================================
# Gradle Daemon 与构建性能优化
# Metaspace 与堆独立，给足不会常驻占用；上限过低会在 AGP + R8 + Lint
# 同时加载类时耗尽并强制重启 daemon
# ============================================================
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2048m
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存未启用：实测每轮都判定条目失效（configuration-cache 目录下的
# buildfingerprint*.tmp 在构建结束时被清理），复用从未命中，只剩存储与清理开销

# ============================================================
# Kotlin 编译优化
# 编译守护进程独立于 Gradle daemon，不显式限额时会用默认值，大工程易在增量编译阶段 OOM
# ============================================================
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Android Gradle Plugin
# android.useAndroidX / android.nonTransitiveRClass / android.nonFinalResIds
# 在 AGP 8+ 中均默认为 true，无需显式声明
android.useAndroidX=true
