# ============================================================
# Gradle Daemon 与构建性能优化
# Metaspace 与堆独立，给足不会常驻占用；上限过低会在 AGP + R8 + Lint
# 同时加载类时耗尽并强制重启 daemon
# ============================================================
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2048m
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：配置阶段由 Kotlin DSL 与 AGP 变体配置主导，命中时整段跳过。
# 此前条目每轮失效的原因是 refreshVersions 的目录遍历把 .gradle/configuration-cache/**
# 登记成了配置输入（插件已改为不下探隐藏目录），并非 Gradle 自身清理缓存文件
org.gradle.configuration-cache=true
# IDE 同步经 Tooling API 并行构建模型；不显式声明时会从 org.gradle.parallel 隐式推导，
# 该隐式推导已弃用，Gradle 10 起在模型构建期间直接报错
org.gradle.tooling.parallel=true

# ============================================================
# Kotlin 编译优化
# 编译守护进程独立于 Gradle daemon，不显式限额时会用默认值，大工程易在增量编译阶段 OOM
# ============================================================
kotlin.code.style=official
kotlin.incremental=true
# 编码随 Gradle 侧一致固定为 UTF-8：编译守护进程独立于 daemon，不继承它的 file.encoding
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
